{% extends 'base.html' %}{% set active_page='history' %}{% set page_name='History' %}
{% block title %}ScamShield — History{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">LOCAL SCAN HISTORY</div><h1>Scan history</h1><p>Review recent scans stored locally in this browser.</p></div><button class="btn btn-danger-ghost" id="clearHistory">Clear history</button></div><section class="card history-card"><div class="table-toolbar"><input id="historySearch" class="search" placeholder="Search scam type, stage or content..."/><select id="riskFilter"><option value="all">All risk levels</option><option value="high">High risk</option><option value="mid">Suspicious</option><option value="low">Low risk</option></select></div><div class="history-table" id="historyTable"></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/pages.js') }}"></script>{% endblock %}
